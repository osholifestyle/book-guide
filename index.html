<style>

<script>

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);

    if (k === 'class') el.className = v;

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

/* ================= topic list (non-fiction) =================
   Format: Name | emoji | Group | search terms ; ... | Title~Author ; Title~Author ; ...
   The seed books are well-known titles. Steps 2 and 3 use them so the daily book is always a real, verified book. */

  }

/* ================= Explore: search any book by title or author ================= */
S.ex = { q: '', items: null, loading: false, noNet: false, token: 0, canMore: false };
function fromGBList(items) {
  const seen = new Set(), out = [];
  for (const it of arr(items)) {
    const v = it.volumeInfo || {};
    if (!v.title || !arr(v.authors).length || (v.pageCount && v.pageCount < 40)) continue;
    const m = fromGB(it, '', null), k = tkey(m.title.split(':')[0]) + '|' + lastName(arr(v.authors)[0]);
    if (seen.has(k)) continue; seen.add(k); out.push(m);
  }
  return out.filter(m => m.cover).concat(out.filter(m => !m.cover)).slice(0, 20);   // books with a cover first
}
async function olSearch(q) {

  const seen = new Set(), out = [];

    const author = d.author_name.slice(0, 2).join(', '), k = tkey(d.title) + '|' + lastName(d.author_name[0]);
    if (seen.has(k)) continue; seen.add(k);

async function runSearch(q, online) {

  await Promise.race([loadReadyIndex(), new Promise(r => setTimeout(r, 3000))]);

    ex.items = local.map(x => ({ id: bookId(x.t, x.a), title: x.t, author: x.a, topic: x.topic, isbn: '', pages: 0, rating: 0, ratings: 0, desc: x.h || '', cover: '', cover2: '', src: 'lib' }));
