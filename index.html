<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Book Guide</title>
<meta name="description" content="Understand a book before you buy the physical copy. Simple mini books on any topic.">
<meta name="theme-color" content="#f1f3ef">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#f1f3ef;--surface:#ffffff;--surface2:#e6eae5;--text:#17202a;--muted:#5d6975;--accent:#4b3ba6;--accent2:#3a2c86;--line:#d3d9d3;--gold:#d99a00;--on-accent:#ffffff;--shadow:0 8px 20px rgba(23,32,42,.2);--r:8px;--fs:18px;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;color-scheme:light}
:root[data-theme=dark]{--bg:#11151c;--surface:#1a202a;--surface2:#232b37;--text:#eceef2;--muted:#9aa5b1;--accent:#a99cff;--accent2:#c3b9ff;--line:#2d3644;--gold:#f0b429;--on-accent:#14102e;--shadow:0 8px 20px rgba(0,0,0,.55);color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:88px}
h1,h2,h3,.serif{font-family:var(--serif)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:13px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.brand{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;color:var(--accent2)}
.icon-btn{padding:6px 12px;border:1px solid var(--line);border-radius:8px;color:var(--accent2);font-size:14px}
.view{max-width:760px;margin:auto;padding:16px}
.greet h1{font-size:26px;line-height:1.2}
.greet p{margin-top:4px}
.sh{display:flex;align-items:center;gap:12px;margin:28px 0 10px;font-size:20px;font-weight:700;color:var(--text)}.sh::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.btn{background:var(--accent);color:var(--on-accent);font-weight:700;padding:10px 16px;border-radius:8px;font-size:15px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600}
.btn.on{background:var(--surface2);color:var(--accent2);border:1px solid var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{display:flex;gap:8px;margin-top:14px}
.search input,.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.field{margin-top:12px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.bookcard{display:flex;gap:14px}
.cover{flex:none;width:112px;height:168px;border-radius:2px 6px 6px 2px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.dz{display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#fff;font-family:var(--serif);border-left:5px solid rgba(255,255,255,.25)}
.cover.dz b{font-size:14px;line-height:1.2}.cover.dz i{font-size:11px;opacity:.85;font-style:normal}
.tag{display:inline-block;font-size:12px;background:var(--surface2);color:var(--accent2);border-radius:4px;padding:2px 8px;margin:0 6px 6px 0}
.bc-title{font-family:var(--serif);font-size:21px;line-height:1.2;margin:4px 0}
.hook{margin:8px 0 12px;font-size:14px;color:var(--muted)}
.moods{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.mood{flex:none;width:76px;text-align:center}
.mood-i{display:flex;width:60px;height:60px;margin:0 auto 6px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);align-items:center;justify-content:center;font-size:26px}
.mood-l{font-size:12px;color:var(--muted);display:block;line-height:1.2}
.stats{display:flex;gap:10px}.stat{flex:1;text-align:center;background:var(--surface2);border-radius:12px;padding:10px 4px}
.stat b{display:block;font-size:22px;color:var(--accent2);font-family:var(--serif)}.stat span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:16px;margin-top:14px}
.gb{text-align:left}.gb .cover{width:100%;height:auto;aspect-ratio:2/3}
.gb-t{margin-top:8px;font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gb-a{font-size:12px;color:var(--muted)}
.banner{background:var(--surface2);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}
.empty{text-align:center;padding:48px 16px}.empty .big{font-size:44px}.empty h2{margin:8px 0 6px}
.err{background:var(--surface);border:1px solid #a8452f;border-radius:12px;padding:14px;margin-top:14px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:20}
.nav-in{max-width:760px;margin:auto;display:flex}
.nav-b{flex:1;padding:8px 2px 10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-b .ni{font-size:20px;padding:2px 16px;border-radius:999px}
.nav-b.on{color:var(--accent2)}.nav-b.on .ni{background:var(--surface2)}
.rh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rt{font-size:20px;line-height:1.2}
.rbtns{display:flex;gap:6px;flex:none}
.rctl{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.ptabs{display:flex;gap:6px;overflow-x:auto;margin-top:12px;border-bottom:1px solid var(--line)}
.ptab{flex:none;padding:8px 12px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.ptab.on{color:var(--accent2);border-color:var(--accent2);font-weight:700}
.pbar{height:3px;background:var(--surface2);border-radius:3px;margin-top:0}.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.page{font-size:var(--fs);line-height:1.7;padding-top:6px;font-family:var(--serif)}
.page h2{font-size:1.3em;color:var(--accent2);margin:14px 0 4px}
.page .sec{padding:14px 0;border-bottom:1px solid var(--line)}.page .sec:last-child{border:0}
.page .sec h3{font-size:1.05em;color:var(--accent2);margin-bottom:6px}
.page p{margin:0 0 .8em}
.page ul,.page ol{padding-left:1.2em;margin:0 0 .6em}.page li{margin:.3em 0}
.sub{font-weight:700;margin-top:.6em}
.glance{display:grid;gap:8px}.glance div{background:var(--surface2);border-radius:12px;padding:10px 14px}.glance b{display:block;font-size:.82em;color:var(--accent2)}
.lesson{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;margin-top:4px}
.eg{font-size:.88em;color:var(--muted);font-style:italic}
.hl{background:var(--surface2);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin:8px 0}
.facts{background:var(--surface2);border-radius:12px;padding:12px 16px;margin-top:10px}
.toc button{display:block;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);font-size:16px}
.toc button span{color:var(--accent2);margin-right:8px}
.pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}
.pfoot .pg{font-size:13px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:16px 18px 24px}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.sheet-h h2{font-size:20px}
.x{font-size:18px;padding:4px 8px;color:var(--muted)}
.steps{display:flex;gap:6px;margin:6px 0 10px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--surface2)}.steps i.on{background:var(--accent)}
.stars{display:flex;gap:4px}.stars button{font-size:32px;line-height:1;padding:2px;color:var(--line);-webkit-text-stroke:1px var(--muted)}.stars button.on{color:var(--gold);-webkit-text-stroke:1px var(--gold)}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--surface2);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:60;font-size:14px;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ans{white-space:pre-wrap;margin-top:12px;line-height:1.6}
hr.d{border:0;border-top:1px solid var(--line);margin:18px 0}
a{color:var(--accent2)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.card.feature{border-left:6px solid var(--accent)}
.stamp{border:2px solid var(--accent);outline:2px solid var(--accent);outline-offset:3px;border-radius:6px;padding:14px 18px;margin:24px 6px;transform:rotate(-.5deg)}
.stamp-t{font-size:1.1em;font-weight:700;color:var(--accent2);margin-bottom:6px}
.page .stamp p{margin:0 0 6px}
.page .btn,.page .chip,.review{font-family:var(--sans)}
.review{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;margin-top:24px}
.review h3{font-size:1.15em;margin-bottom:2px}
.review textarea{resize:vertical}
.stars.ro span{font-size:24px;color:var(--line);-webkit-text-stroke:1px var(--muted)}
.stars.ro span.on{color:var(--gold);-webkit-text-stroke:1px var(--gold)}
</style>
</head>
<body>
<div id="app"></div>
<noscript>The Book Guide needs JavaScript to run.</noscript>
<script>
(() => {
'use strict';

/* ================= CONFIG (edit these after you deploy) ================= */
const CFG = {
  // Optional: URL of your own small proxy that holds your Gemini key (see README). Leave "" to let each reader add their own free key.
  PROXY_URL: "https://bookguide-ai.yadav270803h.workers.dev",
  // Optional: a Formspree (or similar) endpoint that receives feedback as JSON. Leave "" to keep feedback on the device only.
  FEEDBACK_ENDPOINT: "",
  // Optional: paste the pre-filled link of your Google Form here. Reviews then arrive in your Google Form responses and Sheet. See README.
  GOOGLE_FORM_LINK: ""
};

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const LS = {
  get(k, d) { try { const v = localStorage.getItem('bg_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('bg_' + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
function clean(s) {
  return String(s == null ? '' : s).replace(/\*\*|__|`/g, '').replace(/^\s*#+\s*/gm, '').replace(/#{2,}\s*/g, '').replace(/^\s*[*•-]\s+/gm, '').replace(/\*(?=\S)([^*\n]+)\*/g, '$1').trim();
}
function stripHtml(s) { try { return (new DOMParser().parseFromString(String(s), 'text/html').body.textContent || '').trim(); } catch (e) { return String(s); } }
function cleanDesc(s) {
  s = String(s == null ? '' : s).replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n\n');
  s = stripHtml(s);
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '$1').replace(/\(\s*https?:\/\/[^)\s]+\s*\)/g, '').replace(/https?:\/\/\S+/g, '');
  s = s.split(/\r?\n\s*-{3,}/)[0];
  return s.replace(/[*_`#]+/g, '').replace(/\s+/g, ' ').trim();
}
function hookText(b) {
  const d = cleanDesc(b.desc || ''); if (!d) return '';
  let t = d.split(/(?<=[.!?])\s/)[0];
  if (t.length > 200) t = t.slice(0, 200).replace(/\s+\S*$/, '') + '…';
  return t;
}
const tkey = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
function hashStr(s) { let x = 2166136261; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }
function rngFrom(seed) { let a = hashStr(String(seed)); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function dateKey(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function scrollTop() { try { window.scrollTo(0, 0); } catch (e) {} }
function toast(msg) { const t = h('div', { class: 'toast' }, msg); document.body.append(t); setTimeout(() => t.classList.add('show'), 10); setTimeout(() => t.remove(), 3000); }
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = h('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function modal(title, content, onClose) {
  const ov = h('div', { class: 'overlay', onClick: e => { if (e.target === ov) close(); } });
  const sheet = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' },
    h('div', { class: 'sheet-h' }, h('h2', { class: 'serif' }, title), h('button', { class: 'x', onClick: close, 'aria-label': 'Close' }, '✕')), content);
  ov.append(sheet); document.body.append(ov);
  function close() { ov.remove(); if (onClose) onClose(); }
  return { close };
}

/* ================= data ================= */
const TOPICS = ["Self-Improvement", "Spiritual", "Mind", "Finance", "Rich Mindset", "Psychology", "Business", "Productivity", "Relationships", "Health", "History", "Philosophy", "Biography", "Science", "Fiction", "Parenting", "Leadership", "Habits", "Economics", "Technology", "Creativity", "Education", "Travel", "Nature", "Mythology", "Poetry", "Mystery", "Fantasy", "Romance", "Sports"];
const EMOJI = { "Self-Improvement": "🚀", "Spiritual": "🧘", "Mind": "🧠", "Finance": "💰", "Rich Mindset": "💎", "Psychology": "🔍", "Business": "💼", "Productivity": "⏱️", "Relationships": "🤝", "Health": "🌿", "History": "🏛️", "Philosophy": "🦉", "Biography": "👤", "Science": "🔬", "Fiction": "📖", "Parenting": "👪", "Leadership": "🧭", "Habits": "🔁", "Economics": "📈", "Technology": "💻", "Creativity": "🎨", "Education": "🎓", "Travel": "✈️", "Nature": "🌲", "Mythology": "⚡", "Poetry": "🪶", "Mystery": "🕵️", "Fantasy": "🐉", "Romance": "💌", "Sports": "🏅" };
// Several search terms per topic, so every refresh can show different books.
const Q = {
  "Self-Improvement": ["self-help", "personal development", "self improvement", "motivation", "confidence", "success"],
  "Spiritual": ["spirituality", "meditation", "mindfulness", "religion", "inspiration", "eastern philosophy"],
  "Mind": ["psychology", "cognitive psychology", "neuroscience", "mind and body", "thinking", "emotional intelligence"],
  "Finance": ["personal finance", "investing", "money management", "financial planning", "saving money", "stock market"],
  "Rich Mindset": ["wealth", "entrepreneurship", "business success", "millionaires", "financial independence", "money psychology"],
  "Psychology": ["psychology", "behavioral psychology", "social psychology", "human behavior", "personality"],
  "Business": ["business", "management", "marketing", "startups", "sales", "strategy"],
  "Productivity": ["productivity", "time management", "focus", "work habits", "organization"],
  "Relationships": ["relationships", "communication", "marriage", "friendship", "dating", "family"],
  "Health": ["health", "nutrition", "fitness", "sleep", "mental health", "wellness"],
  "History": ["history", "world history", "ancient history", "military history", "modern history"],
  "Philosophy": ["philosophy", "stoicism", "ethics", "existentialism", "ancient philosophy"],
  "Biography": ["biography", "autobiography", "memoir", "biography business", "biography leaders"],
  "Science": ["science", "physics", "biology", "astronomy", "popular science", "evolution"],
  "Fiction": ["fiction", "literary fiction", "classics", "short stories", "novels"],
  "Parenting": ["parenting", "child development", "teenagers", "family life"],
  "Leadership": ["leadership", "management leadership", "teamwork", "decision making"],
  "Habits": ["habits", "behavior change", "discipline", "willpower", "routine"]
};
const termsFor = t => Q[t] || [t.toLowerCase()];
const PAGE_NAMES = ["Cover", "What's Inside", "Meet the Author", "Key Learnings", "Things to Remember", "Practical Exercises", "Closing"];
const topicColor = t => `hsl(${hashStr(t || 'x') % 360} 42% 26%)`;

/* ================= state ================= */
let user = LS.get('user', null);
let settings = Object.assign({ apiKey: '', gbKey: '', model: 'gemini-flash-latest', reminder: { on: false, time: '20:00' }, theme: 'light', font: 18 }, LS.get('settings', {}));
settings.reminder = Object.assign({ on: false, time: '20:00' }, settings.reminder || {});
let lib = LS.get('lib', []);
let metas = LS.get('metas', {});
let minis = LS.get('minis', {});
let progress = LS.get('progress', {});
let daily = LS.get('daily', null);
let recent = LS.get('recent', []);
let feedbackLog = LS.get('feedback', []);
const S = { tab: 'home', cur: null, page: 0, loading: new Set(), miniError: {}, miniDetail: {}, explore: { mode: '', q: '', topic: '', results: [], loading: false, error: '', start: 0 }, libTab: 'read', libQ: '' };
const saveSettings = () => LS.set('settings', settings);
const saveLib = () => LS.set('lib', lib);
function saveMetas() { LS.set('metas', metas); }
function saveMinis() {
  let ok = LS.set('minis', minis);
  while (!ok && Object.keys(minis).length > 1) {
    const keep = new Set(lib.map(x => x.id));
    const k = Object.keys(minis).find(id => !keep.has(id)) || Object.keys(minis)[0];
    delete minis[k]; ok = LS.set('minis', minis);
  }
}
const hasAI = () => !!(settings.apiKey || CFG.PROXY_URL);
const inLib = id => lib.find(x => x.id === id);
const userTopics = () => (user && user.topics && user.topics.length ? user.topics : TOPICS.slice(0, 5));
function addMeta(b) { if (b.desc) b.desc = cleanDesc(b.desc); metas[b.id] = Object.assign(metas[b.id] || {}, b); saveMetas(); }
function setStatus(id, status) {
  const e = inLib(id);
  if (e && e.status === status) lib = lib.filter(x => x !== e);
  else if (e) { e.status = status; e.date = new Date().toISOString(); }
  else lib.push({ id, status, date: new Date().toISOString() });
  saveLib();
}
function excludeSet() {
  const s = new Set();
  const add = id => { s.add(id); const m = metas[id]; if (m) s.add(tkey(m.title)); };
  lib.forEach(e => add(e.id)); recent.forEach(add);
  return s;
}

/* ================= book sources (Google Books + Open Library) ================= */
function normGB(it) {
  const v = it.volumeInfo || {};
  if (!v.title || !(v.authors && v.authors.length)) return null;
  let cover = (v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail)) || '';
  cover = cover.replace(/^http:/, 'https:').replace('&edge=curl', '');
  return { id: it.id, src: 'gb', title: v.title, subtitle: v.subtitle || '', author: v.authors.join(', '), year: (v.publishedDate || '').slice(0, 4), desc: cleanDesc(v.description || ''), cats: v.categories || [], pages: v.pageCount || 0, cover, ratings: v.ratingsCount || 0 };
}
async function gbFetch(q, start, max = 40) {

    h('div', { class: 'field' }, h('label', null, 'Age range (optional)'), ageIn), h('div', { class: 'field' }, h('label', null, 'Country (optional)'), countryIn), h('div', { class: 'field' }, h('label', null, 'How often do you read? (optional)'), freqIn), saveBtn,
    h('p', { class: 'muted small', style: { marginTop: '10px' } }, 'Privacy: these details stay in this browser only. Nothing is sent to a server.')));
  // reminder
  const on = h('input', { type: 'checkbox', checked: settings.reminder.on }), tm = h('input', { type: 'time', value: settings.reminder.time });
  on.addEventListener('change', async () => { settings.reminder.on = on.checked; saveSettings(); if (on.checked && 'Notification' in window && Notification.permission === 'default') { try { await Notification.requestPermission(); } catch (e) {} } toast(on.checked ? 'Daily reminder on' : 'Daily reminder off'); });
  tm.addEventListener('change', () => { if (tm.value) { settings.reminder.time = tm.value; saveSettings(); } });
  v.append(h('div', { class: 'card' }, h('h3', { class: 'serif' }, 'Daily reminder'),
    h('div', { class: 'field' }, h('label', { style: { display: 'flex', gap: '8px', alignItems: 'center', fontSize: '15px', color: 'var(--text)' } }, on, 'Remind me about my daily book')),
    h('div', { class: 'field' }, h('label', null, 'Time'), tm),
    h('div', { class: 'row', style: { marginTop: '12px' } }, h('button', { class: 'btn ghost sm', onClick: () => download('book-guide-daily.ics', icsFile(), 'text/calendar') }, '📅 Add daily reminder to calendar')),
    h('p', { class: 'muted small', style: { marginTop: '8px' } }, 'Browser reminders only work while this page is open. The calendar button is the reliable option: it adds a repeating event to your phone or computer calendar.')));
  // AI
  const keyIn = h('input', { type: 'password', value: settings.apiKey, placeholder: 'Paste your Gemini API key', autocomplete: 'off' }), modelIn = h('input', { type: 'text', value: settings.model });
  v.append(h('div', { class: 'card' }, h('h3', { class: 'serif' }, 'AI mini books'),
    CFG.PROXY_URL ? h('p', { class: 'muted small' }, 'AI mini books are already enabled on this site. You do not need a key.') : h('p', { class: 'muted small' }, 'Full 6-page mini books are written by Google Gemini. Get a free key at ', h('a', { href: 'https://aistudio.google.com/apikey', target: '_blank', rel: 'noopener' }, 'aistudio.google.com/apikey'), ' and paste it here. It is saved only in this browser.'),
    CFG.PROXY_URL ? null : h('div', { class: 'field' }, h('label', null, 'Gemini API key'), keyIn),
    h('div', { class: 'field' }, h('label', null, 'Model name (change it if you hit a limit)'), modelIn),
    h('button', { class: 'btn sm', style: { marginTop: '12px' }, onClick: () => { settings.apiKey = keyIn.value.trim(); settings.model = modelIn.value.trim() || 'gemini-flash-latest'; saveSettings(); toast('Saved'); } }, 'Save')));
  // feedback + data
  v.append(h('div', { class: 'card' }, h('h3', { class: 'serif' }, 'Feedback and data'),
    h('div', { class: 'row' }, h('button', { class: 'btn sm', onClick: () => openFeedback(null) }, '💬 Send feedback'), h('button', { class: 'btn ghost sm', onClick: exportData }, '⬇ Export my data'), h('button', { class: 'btn ghost sm', onClick: () => { if (confirm('Delete your profile, library, saved books and settings from this browser? This cannot be undone.')) { Object.keys(localStorage).filter(k => k.startsWith('bg_')).forEach(k => localStorage.removeItem(k)); location.reload(); } } }, '🗑 Delete all my data'))));
  return v;
}

/* ================= sheets ================= */
function openAsk() {
  const q = h('textarea', { rows: 3, placeholder: 'Ask about a book or topic. For example: "Which book should I read to build better money habits?"' });
  const out = h('div', { class: 'ans' });
  const send = h('button', { class: 'btn', style: { marginTop: '10px' }, onClick: async () => {
    const text = q.value.trim(); if (!text) return;
    if (!hasAI()) { out.textContent = errMsg(new Error('NO_KEY')); return; }
    send.disabled = true; out.replaceChildren(h('span', { class: 'spin' }), 'Thinking…');
    try { out.textContent = await askBook(text); } catch (e) { out.textContent = errMsg(e); }
    send.disabled = false;
  } }, 'Ask');
  modal('Ask The Book Guide', h('div', null, h('div', { class: 'field' }, q), send, out));
}
function openFeedback(book) {
  let rating = 0, buy = '';
  const starBox = h('div', { class: 'stars' }), buyBox = h('div', { class: 'row' }), txt = h('textarea', { rows: 3, placeholder: 'What would you change?' });
  const drawS = () => starBox.replaceChildren(...[1, 2, 3, 4, 5].map(n => h('button', { class: n <= rating ? 'on' : '', 'aria-label': n + ' stars', onClick: () => { rating = n; drawS(); } }, '★')));
  const drawB = () => buyBox.replaceChildren(...['Yes', 'Maybe', 'No'].map(o => h('button', { class: 'chip' + (buy === o ? ' on' : ''), onClick: () => { buy = o; drawB(); } }, o)));
  drawS(); drawB();
  const m = modal('Quick feedback', h('div', null, book ? h('p', { class: 'muted small' }, 'About: ' + book.title) : null,
    h('div', { class: 'field' }, h('label', null, 'How good was the summary?'), starBox), h('div', { class: 'field' }, h('label', null, 'Would you buy the physical book after reading this?'), buyBox),
    h('div', { class: 'field' }, h('label', null, 'Anything you would change? (optional)'), txt, feedbackNote()),
    h('button', { class: 'btn', style: { marginTop: '14px' }, onClick: async () => {
      if (!rating) { toast('Please give a star rating'); return; }
      const entry = { date: new Date().toISOString(), book: book ? book.title : null, author: book ? book.author : '', rating, buy, text: txt.value.trim().slice(0, 1000) };
      feedbackLog.push(entry); LS.set('feedback', feedbackLog);
      await sendFeedback(entry);
      m.close(); toast('Thank you for your feedback!');
    } }, 'Send')));
}
function onboarding() {
  let step = 1; const d = { name: user ? user.name : '', topics: new Set(user ? user.topics : []), age: '', country: '', freq: '', ok: false };
  const box = h('div'); const m = modal('Welcome to The Book Guide', box);
  function draw() {
    const bar = h('div', { class: 'steps' }, [1, 2, 3].map(n => h('i', { class: n <= step ? 'on' : '' })));
    if (step === 1) {
      const nm = h('input', { type: 'text', value: d.name, maxlength: 40, placeholder: 'Your first name (optional)' });
      const ck = h('input', { type: 'checkbox', checked: d.ok });
      box.replaceChildren(bar, h('p', { class: 'muted' }, 'Understand a book first, then decide if the physical copy is worth buying.'), h('div', { class: 'field' }, nm),
        h('label', { style: { display: 'flex', gap: '8px', marginTop: '14px', fontSize: '14px', alignItems: 'flex-start' } }, ck, 'I understand my name, topics and library are saved only in this browser, and I can delete them any time in Profile.'),
        h('div', { class: 'row', style: { marginTop: '16px' } }, h('button', { class: 'btn', onClick: () => { d.name = nm.value.trim(); d.ok = ck.checked; if (!d.ok) { toast('Please tick the box to continue'); return; } step = 2; draw(); } }, 'Next'), h('button', { class: 'btn ghost', onClick: () => m.close() }, 'Skip for now')));
    } else if (step === 2) {
      const nextBtn = h('button', { class: 'btn', onClick: () => { if (d.topics.size < 3) { toast('Pick at least 3 topics'); return; } step = 3; draw(); } }, 'Next');
      box.replaceChildren(bar, h('p', { class: 'muted' }, 'Pick at least 3 topics you enjoy. You can add your own too.'), topicPicker(d.topics, () => {}), h('div', { class: 'row', style: { marginTop: '16px' } }, h('button', { class: 'btn ghost', onClick: () => { step = 1; draw(); } }, 'Back'), nextBtn));
    } else {
      const age = h('select', null, ['', 'Under 18', '18-24', '25-34', '35-44', '45-54', '55+'].map(o => h('option', { value: o }, o || 'Prefer not to say')));
      const country = h('input', { type: 'text', maxlength: 40 });
      const freq = h('select', null, [['', 'Prefer not to say'], ['rarely', 'Rarely'], ['sometimes', 'Sometimes'], ['often', 'Often']].map(([val, l]) => h('option', { value: val }, l)));
      box.replaceChildren(bar, h('p', { class: 'muted' }, 'Optional. You can skip all of these.'), h('div', { class: 'field' }, h('label', null, 'Age range'), age), h('div', { class: 'field' }, h('label', null, 'Country'), country), h('div', { class: 'field' }, h('label', null, 'How often do you read?'), freq),
        h('div', { class: 'row', style: { marginTop: '16px' } }, h('button', { class: 'btn ghost', onClick: () => { step = 2; draw(); } }, 'Back'), h('button', { class: 'btn', onClick: () => {
          user = { name: d.name, topics: [...d.topics], age: age.value, country: country.value.trim(), freq: freq.value, joined: new Date().toISOString() };
          LS.set('user', user); dailyP = null; m.close(); toast('You are all set!'); render();
        } }, 'Finish')));
    }
  }
  draw();
}

/* ================= reminders + start ================= */
setInterval(() => {
  const r = settings.reminder; if (!r.on) return;
  const n = new Date(), hm = String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
  if (hm === r.time && LS.get('lastRemind', '') !== dateKey()) {
    LS.set('lastRemind', dateKey()); toast('📖 Your book for today is ready');
    if ('Notification' in window && Notification.permission === 'granted') { try { new Notification('The Book Guide', { body: 'Your book for today is ready.' }); } catch (e) {} }
  }
}, 20000);
render();
if (!user && !LS.get('skipped', false)) { LS.set('skipped', true); onboarding(); }
})();
